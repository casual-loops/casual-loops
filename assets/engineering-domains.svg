<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="title desc"><title id="title">Engineering Domain Signal Map</title><desc id="desc">Five spokes link systems, network, software, cloud, and AI engineering to one iterative learning practice. Domains are interests rather than proficiency rankings.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset=".55" stop-color="#121e31"/><stop offset="1" stop-color="#0c1320"/></linearGradient><linearGradient id="beam"><stop stop-color="#58a6ff"/><stop offset=".52" stop-color="#7ee7ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#263c55" stroke-width=".6" opacity=".34"/></pattern></defs><rect width="1200" height="590" rx="18" fill="url(#bg)"/><rect width="1200" height="590" rx="18" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="588" rx="17" fill="none" stroke="#34465c"/><path d="M22 3H1178" stroke="url(#beam)" stroke-width="3"/><text x="44" y="51" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">SIGNAL MAP</text><text x="267" y="51" fill="#7ee7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="500" text-anchor="start" letter-spacing="1.5">// FIVE ENGINEERING DOMAINS</text><text x="1155" y="50" fill="#9aacc2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="end" letter-spacing="1">01 CORE / 05 ORBITS</text><path d="M44 72H1156" stroke="#34465c"/><circle cx="600" cy="306" r="220" fill="none" stroke="#2b425d" stroke-dasharray="3 9"/><circle cx="600" cy="306" r="154" fill="none" stroke="#26384d" stroke-width="1"/><path d="M600 306L600 136" stroke="#7ee7ff" stroke-width="2.4" opacity=".7"/><circle cx="600" cy="136" r="5" fill="#7ee7ff"/><rect x="415" y="100" width="370" height="72" rx="12" fill="#142237" stroke="#7ee7ff" stroke-opacity=".65" stroke-width="1.5"/><path d="M429 101h58" stroke="#7ee7ff" stroke-width="2.5"/><text x="600" y="126" fill="#f2f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">01  SYSTEMS ENGINEERING</text><text x="600" y="152" fill="#b8c9db" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">Infrastructure / IAM / reliability</text><path d="M600 306L930 230" stroke="#58a6ff" stroke-width="2.4" opacity=".7"/><circle cx="930" cy="230" r="5" fill="#58a6ff"/><rect x="730" y="194" width="400" height="72" rx="12" fill="#142237" stroke="#58a6ff" stroke-opacity=".65" stroke-width="1.5"/><path d="M744 195h58" stroke="#58a6ff" stroke-width="2.5"/><text x="930" y="220" fill="#f2f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">02  NETWORK ENGINEERING</text><text x="930" y="246" fill="#b8c9db" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">DNS / routing / protocols / security</text><path d="M600 306L804 446" stroke="#bc8cff" stroke-width="2.4" opacity=".7"/><circle cx="804" cy="446" r="5" fill="#bc8cff"/><rect x="598" y="410" width="412" height="72" rx="12" fill="#142237" stroke="#bc8cff" stroke-opacity=".65" stroke-width="1.5"/><path d="M612 411h58" stroke="#bc8cff" stroke-width="2.5"/><text x="804" y="436" fill="#f2f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">03  SOFTWARE ENGINEERING</text><text x="804" y="462" fill="#b8c9db" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">Applications / APIs / data / testing</text><path d="M600 306L396 446" stroke="#58a6ff" stroke-width="2.4" opacity=".7"/><circle cx="396" cy="446" r="5" fill="#58a6ff"/><rect x="200" y="410" width="392" height="72" rx="12" fill="#142237" stroke="#58a6ff" stroke-opacity=".65" stroke-width="1.5"/><path d="M214 411h58" stroke="#58a6ff" stroke-width="2.5"/><text x="396" y="436" fill="#f2f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">04  CLOUD ENGINEERING</text><text x="396" y="462" fill="#b8c9db" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">Azure / containers / IaC / CI/CD</text><path d="M600 306L270 230" stroke="#bc8cff" stroke-width="2.4" opacity=".7"/><circle cx="270" cy="230" r="5" fill="#bc8cff"/><rect x="87" y="194" width="366" height="72" rx="12" fill="#142237" stroke="#bc8cff" stroke-opacity=".65" stroke-width="1.5"/><path d="M101 195h58" stroke="#bc8cff" stroke-width="2.5"/><text x="270" y="220" fill="#f2f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">05  AI ENGINEERING</text><text x="270" y="246" fill="#b8c9db" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0">RAG / retrieval / model integration</text><circle cx="600" cy="306" r="95" fill="#0d1729" stroke="#425978" stroke-width="1.5"/><circle cx="600" cy="306" r="78" fill="#18314a" stroke="#7ee7ff" stroke-width="2.4"/><circle cx="600" cy="306" r="66" fill="none" stroke="#7ee7ff" stroke-dasharray="3 7" opacity=".45"/><text x="600" y="282" fill="#7ee7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">CORE LOOP</text><text x="600" y="314" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">BUILD / OPERATE</text><text x="600" y="341" fill="#bc8cff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="0">OBSERVE / LEARN</text><path d="M44 539H1156" stroke="#34465c"/><text x="44" y="564" fill="#91a7bf" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0.9">AN EXPLORATION MAP, NOT A CLAIM OF EQUAL EXPERTISE</text><text x="1156" y="564" fill="#7ee7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" text-anchor="end" letter-spacing="1">CASUAL-LOOPS // SIGNAL</text></svg>