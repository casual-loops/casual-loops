<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Casual Loops Mission Control</title>
  <desc id="desc">A dark astronomy and systems engineering themed banner with orbital paths, network nodes, stars, and telemetry text.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7ee7ff"/>
      <stop offset="45%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#6e40c9"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#30363d"/>

  <g fill="#8b949e" opacity="0.85">
    <circle cx="80" cy="58" r="1.5"/>
    <circle cx="153" cy="98" r="1.2"/>
    <circle cx="250" cy="42" r="1.8"/>
    <circle cx="342" cy="76" r="1.1"/>
    <circle cx="438" cy="50" r="1.5"/>
    <circle cx="520" cy="88" r="1.3"/>
    <circle cx="615" cy="38" r="1.7"/>
    <circle cx="704" cy="73" r="1.2"/>
    <circle cx="782" cy="44" r="1.4"/>
    <circle cx="894" cy="86" r="1.8"/>
    <circle cx="1024" cy="55" r="1.2"/>
    <circle cx="1110" cy="110" r="1.6"/>
    <circle cx="92" cy="282" r="1.4"/>
    <circle cx="215" cy="318" r="1.1"/>
    <circle cx="392" cy="296" r="1.5"/>
    <circle cx="575" cy="324" r="1.2"/>
    <circle cx="748" cy="302" r="1.6"/>
    <circle cx="910" cy="319" r="1.2"/>
    <circle cx="1080" cy="286" r="1.7"/>
  </g>

  <g opacity="0.75" fill="none">
    <ellipse cx="955" cy="180" rx="166" ry="70" transform="rotate(-16 955 180)" stroke="#30363d" stroke-width="1.5"/>
    <ellipse cx="955" cy="180" rx="126" ry="50" transform="rotate(18 955 180)" stroke="#21262d" stroke-width="1"/>
    <path d="M764 260 C840 205, 902 240, 962 198 S1088 120, 1160 145" stroke="url(#signal)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.7"/>
  </g>

  <g stroke="#58a6ff" stroke-width="1.3" opacity="0.9">
    <line x1="824" y1="226" x2="878" y2="207"/>
    <line x1="878" y1="207" x2="926" y2="238"/>
    <line x1="926" y1="238" x2="984" y2="205"/>
    <line x1="984" y1="205" x2="1042" y2="231"/>
    <line x1="1042" y1="231" x2="1097" y2="196"/>
  </g>

  <g fill="#0d1117" stroke="#7ee7ff" stroke-width="2" filter="url(#glow)">
    <circle cx="824" cy="226" r="5"/>
    <circle cx="878" cy="207" r="5"/>
    <circle cx="926" cy="238" r="5"/>
    <circle cx="984" cy="205" r="5"/>
    <circle cx="1042" cy="231" r="5"/>
    <circle cx="1097" cy="196" r="5"/>
  </g>

  <circle cx="955" cy="180" r="39" fill="url(#planet)" filter="url(#glow)"/>
  <circle cx="944" cy="168" r="5" fill="#dbeafe" opacity="0.6"/>
  <circle cx="970" cy="191" r="3" fill="#dbeafe" opacity="0.35"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
    <text x="70" y="76" fill="#58a6ff" font-size="15" letter-spacing="3">MISSION CONTROL // ONLINE</text>
    <text x="70" y="145" fill="#f0f6fc" font-size="50" font-weight="700" letter-spacing="10">CASUAL LOOPS</text>
    <text x="72" y="183" fill="#8b949e" font-size="17" letter-spacing="2">SYSTEMS  •  KNOWLEDGE  •  ITERATION</text>

    <text x="72" y="245" fill="#c9d1d9" font-size="14">MODE</text>
    <text x="160" y="245" fill="#7ee7ff" font-size="14">BUILD / DOCUMENT / ITERATE</text>

    <text x="72" y="273" fill="#c9d1d9" font-size="14">ORBIT</text>
    <text x="160" y="273" fill="#bc8cff" font-size="14">INFRASTRUCTURE / AUTOMATION / RAG</text>

    <text x="72" y="301" fill="#c9d1d9" font-size="14">SIGNAL</text>
    <text x="160" y="301" fill="#58a6ff" font-size="14">I BUILD THINGS TO UNDERSTAND THEM</text>

    <text x="807" y="92" fill="#8b949e" font-size="12" letter-spacing="2">ORBITAL SYSTEM // NODE LINK ACTIVE</text>
  </g>
</svg>
