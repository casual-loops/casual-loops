<text x="61" y="497" fill="#ccdaeb" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="19.5" font-weight="400" >The fastest way to learn a system is often</text>
