<text x="1157" y="50" fill="#9aacc2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="12" font-weight="400" text-anchor="end" letter-spacing="1">05 PRINCIPLES / 01 PRACTICE</text>
<text x="44" y="79" fill="#aebfd3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" font-weight="400" >How I decide what to build, automate, observe, and improve.</text>
