<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="principles-title principles-desc">
<title id="principles-title">Casual Loops Engineering Operating Principles</title>
<desc id="principles-desc">Five operating principles: prefer evidence over assumptions; automate repeatable work and document edge cases; use monitoring to explain system behavior; design infrastructure to be understandable; and learn by owning failure modes.</desc>
