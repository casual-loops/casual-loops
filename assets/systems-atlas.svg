<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="atlas-title atlas-desc">
<title id="atlas-title">Casual Loops systems atlas</title>
<desc id="atlas-desc">A conceptual interconnected map of six engineering domains: compute and connectivity, engineering and automation, data and retrieval, identity and access, observability, and knowledge systems. A central lab core represents the iterative practice linking them.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="52%" stop-color="#111a2a"/><stop offset="100%" stop-color="#0c1521"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#7ee7ff"/><stop offset="100%" stop-color="#bc8cff"/></linearGradient>
  <radialGradient id="hub" cx="50%" cy="45%" r="68%"><stop offset="0%" stop-color="#214063"/><stop offset="55%" stop-color="#162c45"/><stop offset="100%" stop-color="#101a2b"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#213449" stroke-width="0.7" opacity=".42" fill="none"/></pattern>
  <clipPath id="frame"><rect x="1" y="1" width="1198" height="608" rx="21"/></clipPath>
</defs>
<rect width="1200" height="610" rx="22" fill="url(#back)"/>
