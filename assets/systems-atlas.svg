 <text x="66" y="49" fill="#f0f6fc" font-size="21" font-weight="700" letter-spacing="2">SYSTEMS ATLAS</text>
 <text x="272" y="49" fill="#58a6ff" font-size="13" letter-spacing="2.1">// THE ENGINEERING TOOLKIT</text>
 <text x="1155" y="48" text-anchor="end" fill="#a1b3c7" font-size="12.5" letter-spacing="1.8">06 DOMAINS / 01 LAB</text>
 <path d="M42 76H1158" stroke="#34465f" stroke-width="1"/>
 <text x="44" y="100" fill="#98acc3" font-size="13.5">The tools, practices, and systems I use to make complex infrastructure understandable.</text>
</g>
