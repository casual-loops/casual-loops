<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" role="img" aria-labelledby="title desc">
  <title id="title">Casual Loops telemetry header</title>
  <desc id="desc">Mission Control themed header introducing measurable GitHub activity and the engineering domains behind the work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#101a2a"/>
      <stop offset="100%" stop-color="#111d2e"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="55%" stop-color="#7ee7ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#27384e" stroke-width=".6" opacity=".35"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="174" rx="17"/></clipPath>
  </defs>
  <rect width="1200" height="176" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="176" fill="url(#grid)"/>
    <path d="M0 2H1200" stroke="url(#signal)" stroke-width="4"/>
    <circle cx="1190" cy="133" r="116" fill="none" stroke="#375575" opacity=".3"/>
    <circle cx="1190" cy="133" r="155" fill="none" stroke="#375575" opacity=".2"/>
  </g>
  <rect x="1" y="1" width="1198" height="174" rx="17" stroke="#324054" fill="none"/>
  <circle cx="45" cy="37" r="5" fill="#7ee7ff"/>
  <circle cx="45" cy="37" r="11" fill="none" stroke="#7ee7ff" opacity=".35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
    <text x="65" y="43" fill="#7ee7ff" font-size="13.5" font-weight="700" letter-spacing="2">MISSION CONTROL // REPOSITORY TELEMETRY</text>
    <text x="44" y="100" fill="#f0f6fc" font-size="40" font-weight="700" letter-spacing="1.4">ENGINEERING OUTPUT.</text>
    <text x="46" y="137" fill="#9fb4ca" font-size="16">The measurable signals behind what I build.</text>
    <path d="M44 157H647" stroke="url(#signal)" stroke-width="1.4" opacity=".7"/>
    <path d="M674 24V152" stroke="#36506e" stroke-width="1.2"/>
    <text x="704" y="43" fill="#bc8cff" font-size="12" letter-spacing="2">ENGINEERING DOMAINS IN ORBIT</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">
    <rect x="704" y="61" width="146" height="35" rx="6" fill="#14263a" stroke="#365f8b"/>
    <text x="777" y="83" fill="#7ee7ff">INFRASTRUCTURE</text>
    <rect x="860" y="61" width="143" height="35" rx="6" fill="#241b37" stroke="#61458b"/>
    <text x="931.5" y="83" fill="#d7b4ff">IDENTITY / IAM</text>
    <rect x="1013" y="61" width="145" height="35" rx="6" fill="#14263a" stroke="#365f8b"/>
    <text x="1085.5" y="83" fill="#7ee7ff">AUTOMATION</text>
    <rect x="704" y="107" width="218" height="35" rx="6" fill="#14263a" stroke="#365f8b"/>
    <text x="813" y="129" fill="#7ee7ff">OBSERVABILITY</text>
    <rect x="932" y="107" width="226" height="35" rx="6" fill="#241b37" stroke="#61458b"/>
    <text x="1045" y="129" fill="#d7b4ff">KNOWLEDGE / RAG</text>
  </g>
</svg>
