<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="telemetry-title telemetry-description">
  <title id="telemetry-title">Casual Loops engineering telemetry console</title>
  <desc id="telemetry-description">An original Mission Control dashboard describing the operating mission, five engineering channels, and the design, deploy, observe, document, iterate workflow. This is a qualitative profile, not a measured skills chart.</desc>
  <defs>
    <linearGradient id="console-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#101c2d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#7ee7ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="mission-fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132439"/>
      <stop offset="100%" stop-color="#101723"/>
    </linearGradient>
    <pattern id="console-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#263144" stroke-width=".6" opacity=".45"/>
    </pattern>
    <clipPath id="console-clip"><rect x="1" y="1" width="1198" height="478" rx="21"/></clipPath>
  </defs>
  <rect width="1200" height="480" rx="22" fill="url(#console-bg)"/>
  <rect x="1" y="1" width="1198" height="478" rx="21" fill="none" stroke="#303d53" stroke-width="2"/>
  <g clip-path="url(#console-clip)">
    <rect width="1200" height="480" fill="url(#console-grid)" opacity=".38"/>
    <path d="M-10 8H1210" stroke="url(#edge)" stroke-width="4"/>
    <circle cx="1107" cy="210" r="190" fill="none" stroke="#334c6e" stroke-width="1" opacity=".25"/>
    <circle cx="1107" cy="210" r="245" fill="none" stroke="#334c6e" stroke-width="1" opacity=".16"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
    <circle cx="42" cy="43" r="5" fill="#7ee7ff"/>
    <circle cx="42" cy="43" r="10" fill="none" stroke="#7ee7ff" opacity=".3"/>
    <text x="62" y="48" font-size="15" font-weight="700" letter-spacing="1.8" fill="#f0f6fc">CASUAL LOOPS</text>
    <text x="235" y="48" font-size="12" letter-spacing="2" fill="#58a6ff">// TELEMETRY CONSOLE</text>
    <text x="1158" y="47" text-anchor="end" font-size="12" letter-spacing="1" fill="#8b949e">SYSTEMS / KNOWLEDGE / ITERATION</text>
    <path d="M34 70H1166" stroke="#334155" stroke-width="1"/>

    <!-- Primary mission display -->
    <rect x="34" y="88" width="490" height="293" rx="13" fill="url(#mission-fade)" stroke="#2e455f"/>
    <path d="M34 111V101Q34 88 47 88H117" fill="none" stroke="#7ee7ff" stroke-width="2.5"/>
    <text x="60" y="125" font-size="12" letter-spacing="2.5" fill="#7ee7ff">PRIMARY OPERATING MODE</text>
    <text x="60" y="185" font-size="53" letter-spacing="1.5" font-weight="700" fill="#f0f6fc">BUILD.</text>
    <text x="60" y="249" font-size="53" letter-spacing="1.5" font-weight="700" fill="#58a6ff">OBSERVE.</text>
    <text x="60" y="312" font-size="49" letter-spacing=".3" font-weight="700" fill="#bc8cff">UNDERSTAND.</text>
    <path d="M60 327H496" stroke="#355172" stroke-width="1"/>
    <text x="60" y="350" font-size="12.8" fill="#aebdd0">Make complex infrastructure understandable,</text>
    <text x="60" y="368" font-size="12.8" fill="#aebdd0">observable, and repeatable.</text>

    <!-- Operating vector readout -->
    <rect x="542" y="88" width="624" height="293" rx="13" fill="#0f1724" stroke="#2e455f"/>
    <text x="564" y="120" font-size="12" letter-spacing="2.5" fill="#bc8cff">ACTIVE ENGINEERING CHANNELS</text>
    <text x="1142" y="120" text-anchor="end" font-size="11" letter-spacing="1.4" fill="#6e839d">VECTOR / 05</text>
  </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
   <rect x="560" y="137" width="587" height="43" rx="6" fill="#152132" stroke="#263a51" stroke-width=".8"/>
   <rect x="560" y="137" width="3" height="43" rx="1" fill="#58a6ff"/>
   <text x="578" y="164" font-size="12" letter-spacing="1" fill="#58a6ff">01</text>
   <text x="622" y="164" font-size="13.7" font-weight="700" fill="#e6edf3">INFRASTRUCTURE</text>
   <text x="1140" y="164" font-size="12.4" text-anchor="end" fill="#9fb0c5">Proxmox  /  Linux  /  Docker</text>
 </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
   <rect x="560" y="185" width="587" height="43" rx="6" fill="#121d2b" stroke="#263a51" stroke-width=".8"/>
   <rect x="560" y="185" width="3" height="43" rx="1" fill="#bc8cff"/>
   <text x="578" y="212" font-size="12" letter-spacing="1" fill="#bc8cff">02</text>
   <text x="622" y="212" font-size="13.7" font-weight="700" fill="#e6edf3">IDENTITY &amp; ACCESS</text>
   <text x="1140" y="212" font-size="12.4" text-anchor="end" fill="#9fb0c5">IAM  /  SSO  /  Entra ID</text>
 </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
   <rect x="560" y="233" width="587" height="43" rx="6" fill="#152132" stroke="#263a51" stroke-width=".8"/>
   <rect x="560" y="233" width="3" height="43" rx="1" fill="#7ee7ff"/>
   <text x="578" y="260" font-size="12" letter-spacing="1" fill="#7ee7ff">03</text>
   <text x="622" y="260" font-size="13.7" font-weight="700" fill="#e6edf3">AUTOMATION</text>
   <text x="1140" y="260" font-size="12.4" text-anchor="end" fill="#9fb0c5">Python  /  PowerShell</text>
 </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
   <rect x="560" y="281" width="587" height="43" rx="6" fill="#121d2b" stroke="#263a51" stroke-width=".8"/>
   <rect x="560" y="281" width="3" height="43" rx="1" fill="#58a6ff"/>
   <text x="578" y="308" font-size="12" letter-spacing="1" fill="#58a6ff">04</text>
   <text x="622" y="308" font-size="13.7" font-weight="700" fill="#e6edf3">OBSERVABILITY</text>
   <text x="1140" y="308" font-size="12.4" text-anchor="end" fill="#9fb0c5">Checkmk  /  Prometheus  /  Grafana</text>
 </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
   <rect x="560" y="329" width="587" height="43" rx="6" fill="#152132" stroke="#263a51" stroke-width=".8"/>
   <rect x="560" y="329" width="3" height="43" rx="1" fill="#bc8cff"/>
   <text x="578" y="356" font-size="12" letter-spacing="1" fill="#bc8cff">05</text>
   <text x="622" y="356" font-size="13.7" font-weight="700" fill="#e6edf3">KNOWLEDGE SYSTEMS</text>
   <text x="1140" y="356" font-size="12.4" text-anchor="end" fill="#9fb0c5">Obsidian  /  RAG  /  pgvector</text>
 </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
  <!-- Iterative control loop -->
  <rect x="34" y="397" width="1132" height="63" rx="10" fill="#0c1522" stroke="#293e56"/>
  <text x="54" y="417" font-size="10" letter-spacing="2.2" fill="#8396ae">CONTROL LOOP // REPEATABLE PRACTICE</text>
  <path d="M229 437H972" stroke="#375172" stroke-width="1.8" stroke-dasharray="4 7"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
 <circle cx="139" cy="438" r="11" fill="#101a2a" stroke="#58a6ff" stroke-width="1.5"/>
 <text x="139" y="441" text-anchor="middle" fill="#58a6ff" font-size="9">01</text>
 <text x="161" y="442" fill="#d6e2ee" font-size="13" letter-spacing=".8">DESIGN</text>
 </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
 <circle cx="355" cy="438" r="11" fill="#101a2a" stroke="#7ee7ff" stroke-width="1.5"/>
 <text x="355" y="441" text-anchor="middle" fill="#7ee7ff" font-size="9">02</text>
 <text x="377" y="442" fill="#d6e2ee" font-size="13" letter-spacing=".8">DEPLOY</text>
 </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
 <circle cx="572" cy="438" r="11" fill="#101a2a" stroke="#bc8cff" stroke-width="1.5"/>
 <text x="572" y="441" text-anchor="middle" fill="#bc8cff" font-size="9">03</text>
 <text x="594" y="442" fill="#d6e2ee" font-size="13" letter-spacing=".8">OBSERVE</text>
 </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
 <circle cx="788" cy="438" r="11" fill="#101a2a" stroke="#58a6ff" stroke-width="1.5"/>
 <text x="788" y="441" text-anchor="middle" fill="#58a6ff" font-size="9">04</text>
 <text x="810" y="442" fill="#d6e2ee" font-size="13" letter-spacing=".8">DOCUMENT</text>
 </g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
 <circle cx="999" cy="438" r="11" fill="#101a2a" stroke="#7ee7ff" stroke-width="1.5"/>
 <text x="999" y="441" text-anchor="middle" fill="#7ee7ff" font-size="9">05</text>
 <text x="1021" y="442" fill="#d6e2ee" font-size="13" letter-spacing=".8">ITERATE</text>
 </g>
</svg>
